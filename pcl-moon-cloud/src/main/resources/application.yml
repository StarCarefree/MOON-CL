server:
  port: ${PCL_MOON_PUBLIC_PORT:${MOONCL_PUBLIC_PORT:6664}}
  address: ${PCL_MOON_PUBLIC_BIND:${MOONCL_PUBLIC_BIND:0.0.0.0}}
  shutdown: graceful
  max-http-request-header-size: 8KB
  tomcat:
    threads:
      max: 64
      min-spare: 4
    max-connections: 2048
    accept-count: 100
    connection-timeout: 10s
    keep-alive-timeout: 15s
    max-keep-alive-requests: 100
  error:
    include-message: never
    include-stacktrace: never
spring:
  main:
    banner-mode: off
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      enabled: false
  web:
    resources:
      add-mappings: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
pclmoon:
  admin-port: ${PCL_MOON_ADMIN_PORT:${MOONCL_ADMIN_PORT:8081}}
  admin-bind: ${PCL_MOON_ADMIN_BIND:${MOONCL_ADMIN_BIND:127.0.0.1}}
  admin-token: ${PCL_MOON_ADMIN_TOKEN:${MOONCL_ADMIN_TOKEN:}}
  data-dir: ${PCL_MOON_DATA_DIR:${MOONCL_DATA_DIR:./data}}
